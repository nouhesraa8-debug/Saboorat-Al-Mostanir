{"name": "apply", "on": "workflow_dispatch", "permissions": {"contents": "write"}, "jobs": {"apply": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Apply", "run": "set -e\nmkdir /tmp/new\nunzip -q ./*code.zip -d /tmp/new\nfind . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +\ncp -a /tmp/new/. .\nrm -f ./*code.zip\ngit config user.name mostanir\ngit config user.email noreply@users.noreply.github.com\ngit add -A\ngit commit -m 'Update project' || true\ngit push\n"}]}}}
