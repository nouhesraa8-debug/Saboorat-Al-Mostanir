name: update
on:
  push:
    paths:
      - code.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replace
        run: |
          mkdir /tmp/new && unzip -q code.zip -d /tmp/new
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/new/. .
          git config user.name "Mostanir"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "Update project" || true
          git push
