name: apply
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replace
        run: |
          Z=$(ls *code.zip | head -1)
          mkdir /tmp/new && unzip -q "$Z" -d /tmp/new
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/new/. .
          git config user.name "Mostanir"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "Update project" || true
          git push
